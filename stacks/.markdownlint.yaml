---
# Overrides the root .markdownlint.yaml for terraform-docs-generated README
# content under this directory (see the terraform_docs hook in
# .pre-commit-config.yaml and docs/TERRAFORM.md). terraform-docs emits
# <a name="..."> anchors and <pre>/<br> tags for multi-line defaults
# (MD033), and pulls variable descriptions verbatim into its tables, which
# can include a raw URL (MD034). None of this is hand-edited:
# terraform-docs regenerates the file on every pre-commit run.
extends: ../.markdownlint.yaml
MD033: false
MD034: false
