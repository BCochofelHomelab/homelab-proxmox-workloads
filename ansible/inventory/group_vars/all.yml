---
# ============================================================================
# Hand-authored. NOT generated by OpenTofu (that's only inventory/*.ini).
# ============================================================================

# Elastic Stack version, for every DEB package (Elasticsearch, Kibana,
# Logstash). Keep it at or above elastic_agent_version in the Packer
# template (packer/ubuntu-26.04/variables.pkr.hcl): an agent must not be
# newer than the stack it enrolls into. Bump it here and roll out with the playbooks.
elastic_version: "9.5.4"
# Elastic's APT repository for that major version.
elastic_apt_repo: "https://artifacts.elastic.co/packages/{{ elastic_version.split('.')[0] }}.x/apt"

# DNS search domain the VMs get from cloud-init (terramate.tm.hcl).
homelab_domain: homelab.bcochofel.com

# Internal CA for the Elastic stack's TLS (docs/ANSIBLE.md): the CA
# certificate is committed, its key is SOPS-encrypted to your age key only,
# both created once by `mise run pki:init`. Node keys are generated on
# each host and never leave it; only their CSRs are signed on the
# controller.
elastic_pki_dir: "{{ playbook_dir }}/../pki"
elastic_ca_cert: "{{ elastic_pki_dir }}/elastic-ca.crt"
elastic_ca_key: "{{ elastic_pki_dir }}/elastic-ca.key.sops"

# Elasticsearch ports, read by every role that talks to the cluster.
es_http_port: 9200
es_transport_port: 9300
# HTTPS endpoints of every Elasticsearch node.
es_hosts: >-
  {{ groups['elasticsearch'] | map('extract', hostvars, 'ansible_host')
     | map('regex_replace', '^', 'https://')
     | map('regex_replace', '$', ':' ~ es_http_port) | list }}

# Fleet Server, where every agent enrolls (stacks/elastic/fleet).
fleet_url: "https://{{ hostvars[groups['fleet_server'][0]].ansible_host }}:8220"

# The Fleet agent policy a VM's agent enrolls into (stacks/elastic/fleet),
# per role: group_vars/elasticsearch.yml and logstash.yml override it.
elastic_agent_policy_id: homelab-vms
