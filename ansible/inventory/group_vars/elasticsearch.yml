---
# Elasticsearch nodes (hand-authored). Node names and IPs come from the
# generated inventory (stacks/elastic/infra).

es_cluster_name: homelab

# JVM heap: at most 50% of the VM's RAM (8 GB) and under ~31 GB.
es_heap_size: 4g

# The 200 GB data disk (stacks/elastic/infra, scsi1) holds path.data.
data_disk_mount_point: /var/lib/elasticsearch

# Fleet agent policy (stacks/elastic/fleet).
elastic_agent_policy_id: elasticsearch-nodes
