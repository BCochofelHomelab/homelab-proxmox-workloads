---
# Installs and configures Elasticsearch on every node in parallel. A node
# is only *started* here when it isn't running yet (a fresh install, where
# all nodes must start together to form the cluster). A running node whose
# configuration changed is only flagged (es_restart_needed): restart.yml
# restarts those one at a time, waiting for green in between.

- name: Check the elastic password is available
  ansible.builtin.assert:
    that:
      - elastic_password is defined
      - elastic_password | length >= 12
    fail_msg: >-
      elastic_password is missing or shorter than 12 characters: create
      inventory/group_vars/all.sops.yaml with `sops` (docs/ANSIBLE.md).
    quiet: true
  no_log: true

# Formed once: a node that already ran has a node metadata directory. Only a
# brand-new cluster gets cluster.initial_master_nodes (see the template).
- name: Check whether this node has already joined a cluster
  ansible.builtin.stat:
    path: "{{ es_data_dir }}/_state"
  become: true
  register: _es_state

- name: Decide whether this run bootstraps a new cluster
  ansible.builtin.set_fact:
    es_bootstrap_cluster: >-
      {{ groups['elasticsearch'] | map('extract', hostvars, '_es_state')
         | map(attribute='stat.exists') | select | list | length == 0 }}

- name: Check whether Elasticsearch is running
  ansible.builtin.systemd_service:
    name: elasticsearch
  become: true
  register: _es_service
  failed_when: false

- name: Install Elasticsearch {{ elastic_version }}
  ansible.builtin.apt:
    name: "elasticsearch={{ elastic_version }}"
    allow_change_held_packages: true
  become: true
  register: _es_package

- name: Hold the package at that version (apt upgrade never touches it)
  ansible.builtin.dpkg_selections:
    name: elasticsearch
    selection: hold
  become: true

# -- Undo the DEB's security auto-configuration ------------------------------

- name: List the keystore entries
  ansible.builtin.command: /usr/share/elasticsearch/bin/elasticsearch-keystore list
  become: true
  register: _es_keystore
  changed_when: false

- name: Remove the auto-configuration's keystore entries
  ansible.builtin.command:
    argv: [/usr/share/elasticsearch/bin/elasticsearch-keystore, remove, "{{ item }}"]
  loop: "{{ es_autoconfig_keystore_entries | intersect(_es_keystore.stdout_lines) }}"
  become: true
  changed_when: true

- name: Remove the auto-configuration's certificates
  ansible.builtin.file:
    path: "{{ es_certs_dir }}/{{ item }}"
    state: absent
  loop: "{{ es_autoconfig_cert_files }}"
  become: true

# The elastic user's password until the security index stores one: set
# before the first start, so the new cluster's elastic password is yours.
- name: Set the bootstrap password
  ansible.builtin.command:
    argv: [/usr/share/elasticsearch/bin/elasticsearch-keystore, add, --stdin, --force, bootstrap.password]
    stdin: "{{ elastic_password }}"
  become: true
  no_log: true
  changed_when: true
  when: "'bootstrap.password' not in _es_keystore.stdout_lines"

# -- TLS from the internal CA ------------------------------------------------

- name: Issue this node's certificate
  ansible.builtin.include_role:
    name: elastic_pki
  vars:
    pki_cert_dir: "{{ es_certs_dir }}"
    pki_group: elasticsearch

# -- Configuration -----------------------------------------------------------

- name: Own the data directory (on the data disk)
  ansible.builtin.file:
    path: "{{ es_data_dir }}"
    state: directory
    owner: elasticsearch
    group: elasticsearch
    mode: "2750"
  become: true

- name: Write elasticsearch.yml
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: "{{ es_config_dir }}/elasticsearch.yml"
    owner: root
    group: elasticsearch
    mode: "0660"
  become: true
  register: _es_config

- name: Set the JVM heap
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (es_heap_size).
      -Xms{{ es_heap_size }}
      -Xmx{{ es_heap_size }}
    dest: "{{ es_config_dir }}/jvm.options.d/heap.options"
    owner: root
    group: elasticsearch
    mode: "0660"
  become: true
  register: _es_heap

- name: Create the systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/elasticsearch.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: es_memory_lock

- name: Allow the heap to be locked in RAM
  ansible.builtin.copy:
    content: |
      # Managed by Ansible: bootstrap.memory_lock needs an unlimited memlock.
      [Service]
      LimitMEMLOCK=infinity
    dest: /etc/systemd/system/elasticsearch.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  register: _es_override
  when: es_memory_lock

- name: Reload systemd after the override changed
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
  when: _es_override.changed

# -- Start or flag for a rolling restart -------------------------------------

- name: Record whether a running node needs a restart
  ansible.builtin.set_fact:
    es_restart_needed: >-
      {{ (_es_service.status.ActiveState | default('inactive')) == 'active'
         and (_es_package.changed or pki_changed or _es_config.changed
              or _es_heap.changed or (_es_override.changed | default(false))) }}

- name: Start Elasticsearch and enable it at boot
  ansible.builtin.systemd_service:
    name: elasticsearch
    state: started
    enabled: true
  become: true
