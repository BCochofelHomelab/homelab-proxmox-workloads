---
# Enrolls the Elastic Agent the Packer template installed (tarball,
# Fleet-upgradable, service disabled) as Fleet Server, into the policy the
# Fleet config stack created. Once enrolled, later runs only keep its
# certificate current and check it's healthy.

- name: Check the Fleet Server policy exists (stacks/elastic/fleet)
  ansible.builtin.uri:
    url: "{{ fleet_server_kibana_url }}/api/fleet/agent_policies/{{ fleet_server_policy_id }}"
    ca_path: "{{ elastic_ca_cert }}"
    url_username: elastic
    url_password: "{{ elastic_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  delegate_to: localhost
  become: false
  register: _fleet_server_policy

- name: Fail if the Fleet config stack hasn't been applied
  ansible.builtin.assert:
    that: _fleet_server_policy.status == 200
    fail_msg: >-
      Agent policy {{ fleet_server_policy_id }} doesn't exist: apply the Fleet
      config stack first (mise run tofu:apply -- stacks/elastic/fleet --tags config).
    quiet: true

- name: Issue Fleet Server's certificate
  ansible.builtin.include_role:
    name: elastic_pki
  vars:
    pki_cert_dir: "{{ fleet_server_certs_dir }}"
    pki_group: root
    pki_key_mode: "0600"

- name: Check whether the agent is already enrolled
  ansible.builtin.stat:
    path: /opt/Elastic/Agent/fleet.enc
  become: true
  register: _fleet_enrolled

# Fleet Server reads its certificate at start.
- name: Restart the agent if its certificate changed
  ansible.builtin.debug:
    msg: Fleet Server's key or certificates changed.
  changed_when: true
  notify: Restart Elastic Agent
  when: pki_changed and _fleet_enrolled.stat.exists

- name: Enroll as Fleet Server
  when: not _fleet_enrolled.stat.exists
  block:
    # enroll talks to the running agent daemon.
    - name: Start the agent
      ansible.builtin.systemd_service:
        name: elastic-agent
        state: started
        enabled: true
      become: true

    # A fresh token each enrollment: drop one left by an earlier attempt.
    - name: Delete a leftover enrollment service token
      ansible.builtin.uri:
        url: "{{ es_hosts | first }}/_security/service/elastic/fleet-server/credential/token/{{ fleet_server_token_name }}"
        method: DELETE
        ca_path: "{{ elastic_ca_cert }}"
        url_username: elastic
        url_password: "{{ elastic_password }}"
        force_basic_auth: true
        status_code: [200, 404]
      delegate_to: localhost
      become: false

    - name: Create the enrollment service token (elastic/fleet-server)
      ansible.builtin.uri:
        url: "{{ es_hosts | first }}/_security/service/elastic/fleet-server/credential/token/{{ fleet_server_token_name }}"
        method: POST
        ca_path: "{{ elastic_ca_cert }}"
        url_username: elastic
        url_password: "{{ elastic_password }}"
        force_basic_auth: true
      delegate_to: localhost
      become: false
      register: _fleet_token
      no_log: true

    # A root-only file, not a command-line argument (visible in `ps`).
    - name: Write the token for the enroll command
      ansible.builtin.copy:
        content: "{{ _fleet_token.json.token.value }}"
        dest: /root/.fleet-server-service-token
        owner: root
        group: root
        mode: "0600"
      become: true
      no_log: true

    - name: Enroll the agent as Fleet Server
      ansible.builtin.command:
        argv:
          - /usr/bin/elastic-agent
          - enroll
          - --force
          - --url={{ fleet_server_url }}
          - --certificate-authorities={{ fleet_server_certs_dir }}/ca.crt
          - --fleet-server-es={{ es_hosts | first }}
          - --fleet-server-es-ca={{ fleet_server_certs_dir }}/ca.crt
          - --fleet-server-service-token-path=/root/.fleet-server-service-token
          - --fleet-server-policy={{ fleet_server_policy_id }}
          - --fleet-server-port={{ fleet_server_port }}
          - --fleet-server-cert={{ fleet_server_certs_dir }}/node.crt
          - --fleet-server-cert-key={{ fleet_server_certs_dir }}/node.key
      become: true
      changed_when: true

  always:
    - name: Remove the token file
      ansible.builtin.file:
        path: /root/.fleet-server-service-token
        state: absent
      become: true

- name: Keep the agent running and enabled at boot
  ansible.builtin.systemd_service:
    name: elastic-agent
    state: started
    enabled: true
  become: true

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Wait for Fleet Server to be healthy over verified TLS
  ansible.builtin.uri:
    url: "{{ fleet_server_url }}/api/status"
    ca_path: "{{ elastic_ca_cert }}"
    status_code: [200, 503]
  delegate_to: localhost
  become: false
  register: _fleet_status
  until: _fleet_status.status == 200 and _fleet_status.json.status == 'HEALTHY'
  retries: 30
  delay: 10
