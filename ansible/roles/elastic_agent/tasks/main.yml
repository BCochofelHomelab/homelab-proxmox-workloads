---
# Enrolls the Elastic Agent the Packer template installed (tarball,
# Fleet-upgradable, basic flavor, service disabled) into the Fleet policy
# of the VM's role (elastic_agent_policy_id). An agent that's enrolled and
# connected is left alone: moving it to another policy is done in Fleet.

- name: Create the directory for the agent's CA
  ansible.builtin.file:
    path: "{{ elastic_agent_ca | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install the internal CA for the agent (Fleet Server's certificate)
  ansible.builtin.copy:
    src: "{{ elastic_ca_cert }}"
    dest: "{{ elastic_agent_ca }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Read the agent's status
  ansible.builtin.command: /usr/bin/elastic-agent status --output json
  become: true
  register: _agent_status
  changed_when: false
  failed_when: false

# Managed by Fleet and connected; anything else (daemon not running, not
# enrolled, can't reach Fleet Server) gets enrolled.
- name: Decide whether to enroll
  ansible.builtin.set_fact:
    _agent_enroll: >-
      {{ _agent_status.rc != 0
         or not ((_agent_status.stdout | from_json).info.is_managed | default(false))
         or ((_agent_status.stdout | from_json).FleetState | default(0)) != 2 }}

- name: Enroll into {{ elastic_agent_policy_id }}
  when: _agent_enroll
  block:
    - name: Check the agent policy exists (stacks/elastic/fleet)
      ansible.builtin.uri:
        url: "{{ elastic_agent_kibana_url }}/api/fleet/agent_policies/{{ elastic_agent_policy_id }}"
        ca_path: "{{ elastic_ca_cert }}"
        url_username: elastic
        url_password: "{{ elastic_password }}"
        force_basic_auth: true
        status_code: [200, 404]
      delegate_to: localhost
      become: false
      register: _agent_policy

    - name: Fail if the Fleet config stack hasn't created it
      ansible.builtin.assert:
        that: _agent_policy.status == 200
        fail_msg: >-
          Agent policy {{ elastic_agent_policy_id }} doesn't exist: apply the Fleet
          config stack first (mise run tofu:apply -- stacks/elastic/fleet --tags config).
        quiet: true

    - name: Read the policy's enrollment token
      ansible.builtin.uri:
        url: "{{ elastic_agent_kibana_url }}/api/fleet/enrollment_api_keys?kuery=policy_id:%22{{ elastic_agent_policy_id }}%22"
        ca_path: "{{ elastic_ca_cert }}"
        url_username: elastic
        url_password: "{{ elastic_password }}"
        force_basic_auth: true
      delegate_to: localhost
      become: false
      register: _agent_tokens
      no_log: true

    # enroll talks to the running agent daemon.
    - name: Start the agent
      ansible.builtin.systemd_service:
        name: elastic-agent
        state: started
        enabled: true
      become: true

    # The enrollment token only goes on the command line for these few
    # seconds: `enroll` has no file option for it.
    - name: Enroll the agent
      ansible.builtin.command:
        argv:
          - /usr/bin/elastic-agent
          - enroll
          - --force
          - --url={{ fleet_url }}
          - --certificate-authorities={{ elastic_agent_ca }}
          - --enrollment-token={{ (_agent_tokens.json['items'] | selectattr('active') | first).api_key }}
      become: true
      changed_when: true
      no_log: true

- name: Keep the agent running and enabled at boot
  ansible.builtin.systemd_service:
    name: elastic-agent
    state: started
    enabled: true
  become: true

- name: Wait for the agent to be connected to Fleet
  ansible.builtin.command: /usr/bin/elastic-agent status --output json
  become: true
  register: _agent_status_after
  changed_when: false
  failed_when: false
  until: >-
    _agent_status_after.rc == 0
    and ((_agent_status_after.stdout | from_json).info.is_managed | default(false))
    and ((_agent_status_after.stdout | from_json).FleetState | default(0)) == 2
  retries: 30
  delay: 10
