---
# Docker's APT repository, trusted only for packages signed by Docker's key
# ("Docker Release (CE deb) <docker@docker.com>"), checked by fingerprint.
docker_repo_url: https://download.docker.com/linux/ubuntu
docker_repo_key_url: "{{ docker_repo_url }}/gpg"
docker_repo_key_fingerprint: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88 # gitleaks:allow (public key fingerprint)
docker_repo_keyring: /usr/share/keyrings/docker.gpg
docker_packages: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
