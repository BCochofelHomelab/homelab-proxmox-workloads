---
# Checked from the controller, as any client would: TLS verified against
# the internal CA, authenticated as elastic.
- name: Elasticsearch health check
  hosts: elasticsearch
  gather_facts: false
  tasks:
    - name: Check every node answers over verified TLS
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:{{ es_http_port }}/"
        ca_path: "{{ elastic_ca_cert }}"
        url_username: elastic
        url_password: "{{ elastic_password }}"
        force_basic_auth: true
      delegate_to: localhost
      become: false
      register: _es_root

    - name: Check every node runs {{ elastic_version }}
      ansible.builtin.assert:
        that: _es_root.json.version.number == elastic_version
        fail_msg: "{{ inventory_hostname }} runs {{ _es_root.json.version.number }}, expected {{ elastic_version }}."
        quiet: true

    - name: Wait for the cluster to be green with every node
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:{{ es_http_port }}/_cluster/health"
        ca_path: "{{ elastic_ca_cert }}"
        url_username: elastic
        url_password: "{{ elastic_password }}"
        force_basic_auth: true
      delegate_to: localhost
      become: false
      register: _es_health
      # Waits: right after formation the cluster is briefly yellow while
      # the system indices' replicas are allocated.
      until: >-
        _es_health.status == 200 and _es_health.json.status == 'green'
        and _es_health.json.number_of_nodes == groups['elasticsearch'] | length
      retries: 30
      delay: 10
      run_once: true

    - name: Show the cluster's health
      ansible.builtin.debug:
        msg: >-
          {{ _es_health.json.cluster_name }}: {{ _es_health.json.status }},
          {{ _es_health.json.number_of_nodes }} nodes,
          {{ _es_health.json.active_shards }} active shards
      run_once: true

- name: Kibana health check
  hosts: kibana_server
  gather_facts: false
  tasks:
    - name: Wait for Kibana to be available over verified TLS
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:5601/api/status"
        ca_path: "{{ elastic_ca_cert }}"
        url_username: elastic
        url_password: "{{ elastic_password }}"
        force_basic_auth: true
        status_code: [200, 503]
      delegate_to: localhost
      become: false
      register: _kibana_status
      until: >-
        _kibana_status.status == 200
        and _kibana_status.json.status.overall.level == 'available'
      retries: 30
      delay: 10

    - name: Check Kibana runs {{ elastic_version }}
      ansible.builtin.assert:
        that: _kibana_status.json.version.number == elastic_version
        fail_msg: "Kibana runs {{ _kibana_status.json.version.number }}, expected {{ elastic_version }}."
        quiet: true

    # Through core's Caddy (homelab-proxmox-core): an external dependency,
    # so reported without failing the playbook.
    - name: Check Kibana answers at {{ kibana_public_url }} (through core's Caddy)
      ansible.builtin.uri:
        url: "{{ kibana_public_url }}/api/status"
        url_username: elastic
        url_password: "{{ elastic_password }}"
        force_basic_auth: true
      delegate_to: localhost
      become: false
      register: _kibana_public
      ignore_errors: true

- name: Logstash health check
  hosts: logstash
  gather_facts: false
  tasks:
    - name: Check the Elastic Agent pipeline is running
      ansible.builtin.uri:
        url: http://127.0.0.1:9600/_node/pipelines/elastic-agent
      become: true
      register: _logstash_pipeline
      failed_when: >-
        _logstash_pipeline.status != 200
        or 'elastic-agent' not in (_logstash_pipeline.json.pipelines | default({}))

    - name: Check Logstash runs {{ elastic_version }}
      ansible.builtin.assert:
        that: _logstash_pipeline.json.version == elastic_version
        fail_msg: "Logstash runs {{ _logstash_pipeline.json.version }}, expected {{ elastic_version }}."
        quiet: true

    # From the controller, like an agent: the port answers and presents a
    # certificate that verifies against the internal CA.
    - name: Check the agent port presents a certificate from the internal CA
      ansible.builtin.command:
        argv:
          - openssl
          - s_client
          - -connect
          - "{{ ansible_host }}:5044"
          - -CAfile
          - "{{ elastic_ca_cert }}"
          - -verify_return_error
          - -brief
        stdin: ""
      delegate_to: localhost
      become: false
      register: _logstash_tls
      changed_when: false
      failed_when: "'Verification: OK' not in _logstash_tls.stderr"

- name: EDOT Collector gateway health check
  hosts: edot_gateway
  gather_facts: false
  # The role's paths and ports, from their one definition.
  vars_files:
    - ../roles/edot_gateway/defaults/main.yml
  tasks:
    - name: Check the collector reports healthy
      ansible.builtin.uri:
        url: http://127.0.0.1:{{ edot_health_port }}/
      become: true

    - name: Read the collector's version
      ansible.builtin.command:
        argv: ["{{ edot_base_dir }}/current/elastic-agent", version, --binary-only]
      become: true
      register: _edot_version
      changed_when: false

    - name: Check the collector runs {{ edot_version }}
      ansible.builtin.assert:
        that: (edot_version ~ ' ') in _edot_version.stdout
        fail_msg: "The EDOT Collector runs {{ _edot_version.stdout }}, expected {{ edot_version }}."
        quiet: true

    # An empty OTLP export, from the gateway's own host with its own
    # certificate (CA-signed, clientAuth): accepted.
    - name: Check OTLP/HTTP accepts a sender with a CA-signed certificate
      ansible.builtin.uri:
        url: https://{{ ansible_host }}:{{ edot_http_port }}/v1/traces
        method: POST
        body_format: json
        body: {}
        ca_path: "{{ edot_certs_dir }}/ca.crt"
        client_cert: "{{ edot_certs_dir }}/node.crt"
        client_key: "{{ edot_certs_dir }}/node.key"
      become: true

    # The same export from the controller, without a client certificate:
    # refused during the TLS handshake (uri reports status -1).
    - name: Check OTLP/HTTP refuses a sender without a certificate
      ansible.builtin.uri:
        url: https://{{ ansible_host }}:{{ edot_http_port }}/v1/traces
        method: POST
        body_format: json
        body: {}
        ca_path: "{{ elastic_ca_cert }}"
      delegate_to: localhost
      become: false
      register: _edot_no_cert
      failed_when: _edot_no_cert.status != -1

- name: Fleet Server health check
  hosts: fleet_server
  gather_facts: false
  tasks:
    - name: Check Fleet Server is healthy over verified TLS
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:{{ fleet_server_port }}/api/status"
        ca_path: "{{ elastic_ca_cert }}"
      delegate_to: localhost
      become: false
      register: _fleet_status
      failed_when: _fleet_status.json.status | default('') != 'HEALTHY'

# From Fleet's side: every host in the inventory (Fleet Server's included)
# has an online agent.
- name: Elastic Agents health check
  hosts: all
  gather_facts: false
  tasks:
    - name: List Fleet's agents
      ansible.builtin.uri:
        url: "https://{{ hostvars[groups['kibana_server'][0]].ansible_host }}:5601/api/fleet/agents?perPage=100"
        ca_path: "{{ elastic_ca_cert }}"
        url_username: elastic
        url_password: "{{ elastic_password }}"
        force_basic_auth: true
      delegate_to: localhost
      become: false
      run_once: true
      register: _fleet_agents

    - name: Check this host's agent is online in Fleet
      ansible.builtin.assert:
        that: >-
          inventory_hostname in (_fleet_agents.json['items']
            | selectattr('status', 'equalto', 'online')
            | map(attribute='local_metadata.host.hostname') | list)
        fail_msg: "{{ inventory_hostname }} has no online agent in Fleet."
        quiet: true
