---
# Checked from the controller, as any client would: TLS verified against
# the internal CA, authenticated as elastic.
- name: Elasticsearch health check
  hosts: elasticsearch
  gather_facts: false
  tasks:
    - name: Check every node answers over verified TLS
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:{{ es_http_port }}/"
        ca_path: "{{ elastic_ca_cert }}"
        url_username: elastic
        url_password: "{{ elastic_password }}"
        force_basic_auth: true
      delegate_to: localhost
      become: false
      register: _es_root

    - name: Check every node runs {{ elastic_version }}
      ansible.builtin.assert:
        that: _es_root.json.version.number == elastic_version
        fail_msg: "{{ inventory_hostname }} runs {{ _es_root.json.version.number }}, expected {{ elastic_version }}."
        quiet: true

    - name: Wait for the cluster to be green with every node
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:{{ es_http_port }}/_cluster/health"
        ca_path: "{{ elastic_ca_cert }}"
        url_username: elastic
        url_password: "{{ elastic_password }}"
        force_basic_auth: true
      delegate_to: localhost
      become: false
      register: _es_health
      # Waits: right after formation the cluster is briefly yellow while
      # the system indices' replicas are allocated.
      until: >-
        _es_health.status == 200 and _es_health.json.status == 'green'
        and _es_health.json.number_of_nodes == groups['elasticsearch'] | length
      retries: 30
      delay: 10
      run_once: true

    - name: Show the cluster's health
      ansible.builtin.debug:
        msg: >-
          {{ _es_health.json.cluster_name }}: {{ _es_health.json.status }},
          {{ _es_health.json.number_of_nodes }} nodes,
          {{ _es_health.json.active_shards }} active shards
      run_once: true

- name: Kibana health check
  hosts: kibana_server
  gather_facts: false
  tasks:
    - name: Wait for Kibana to be available over verified TLS
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:5601/api/status"
        ca_path: "{{ elastic_ca_cert }}"
        url_username: elastic
        url_password: "{{ elastic_password }}"
        force_basic_auth: true
        status_code: [200, 503]
      delegate_to: localhost
      become: false
      register: _kibana_status
      until: >-
        _kibana_status.status == 200
        and _kibana_status.json.status.overall.level == 'available'
      retries: 30
      delay: 10

    - name: Check Kibana runs {{ elastic_version }}
      ansible.builtin.assert:
        that: _kibana_status.json.version.number == elastic_version
        fail_msg: "Kibana runs {{ _kibana_status.json.version.number }}, expected {{ elastic_version }}."
        quiet: true

    # Through core's Caddy (homelab-proxmox-core): an external dependency,
    # so reported without failing the playbook.
    - name: Check Kibana answers at {{ kibana_public_url }} (through core's Caddy)
      ansible.builtin.uri:
        url: "{{ kibana_public_url }}/api/status"
        url_username: elastic
        url_password: "{{ elastic_password }}"
        force_basic_auth: true
      delegate_to: localhost
      become: false
      register: _kibana_public
      ignore_errors: true
